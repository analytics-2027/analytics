<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>POV Body Pose — POC</title>
    <style>
      :root { --bg: #11141a; --panel: #1a1f29; --line: #2b3342; --text: #e6e9ef; --dim: #8b95a7; --accent: #ffe14d; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
      #app { display: grid; grid-template-columns: 300px 1fr; height: 100%; }
      #panel { background: var(--panel); border-right: 1px solid var(--line); padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
      #stage { position: relative; min-width: 0; }
      #view { position: absolute; inset: 0; }
      h1 { font-size: 15px; margin: 0; }
      h1 small { display: block; color: var(--dim); font-weight: 400; margin-top: 2px; }
      label { display: flex; flex-direction: column; gap: 4px; color: var(--dim); font-size: 12px; }
      label.row { flex-direction: row; align-items: center; gap: 8px; color: var(--text); }
      label b { color: var(--text); font-weight: 500; }
      select, button { background: #232a37; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: inherit; }
      button { cursor: pointer; }
      button:hover { border-color: var(--accent); }
      button.on { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 600; }
      input[type="range"] { width: 100%; accent-color: var(--accent); }
      .stack { display: flex; flex-direction: column; gap: 6px; }
      .stack button { text-align: left; }
      .row2 { display: flex; gap: 6px; }
      .row2 > * { flex: 1; }
      pre { margin: 0; padding: 10px; background: #12161d; border: 1px solid var(--line); border-radius: 6px; font: 12px/1.5 ui-monospace, Consolas, monospace; white-space: pre-wrap; }
      #minimap { position: absolute; right: 12px; top: 12px; width: min(300px, 45%); height: auto; border: 1px solid var(--line); border-radius: 8px; background: rgba(17, 20, 26, 0.85); }
      @media (max-width: 800px) {
        #app { grid-template-columns: 1fr; grid-template-rows: minmax(0, 42vh) 1fr; }
        #panel { border-right: 0; border-bottom: 1px solid var(--line); }
      }
      #banner { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); background: rgba(17, 20, 26, 0.85); border: 1px solid var(--line); padding: 6px 12px; border-radius: 999px; color: var(--accent); display: none; }
      #reticle { position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px; border: 1px solid rgba(255,255,255,.55); border-radius: 50%; display: none; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="app">
      <aside id="panel">
        <h1>POV Body Pose — POC <small id="subtitle"></small></h1>
        <div class="row2">
          <button id="play">Lecture</button>
          <select id="speed">
            <option value="0.25">0.25x</option>
            <option value="0.5">0.5x</option>
            <option value="1" selected>1x</option>
            <option value="2">2x</option>
          </select>
        </div>
        <label><span>Temps <b id="timeLabel"></b></span><input id="time" type="range" min="0" value="0" step="1" /></label>
        <label>Joueur<select id="player"></select></label>
        <div class="row2">
          <button id="modeFree" class="on">Vue libre</button>
          <button id="modePov">POV joueur</button>
        </div>
        <label class="row"><input id="lock" type="checkbox" checked /> Horizon verrouillé (ignore le tangage)</label>
        <label class="row"><input id="showCone" type="checkbox" checked /> Cône de vision au sol</label>
        <label class="row"><input id="showPressure" type="checkbox" checked /> Anneau de pression (adversaire le plus proche)</label>
        <label class="row"><input id="showCam" type="checkbox" checked /> Emprise de la caméra TV</label>
        <label><span>Lissage <b id="tauLabel"></b></span><input id="tau" type="range" min="0" max="500" value="120" step="10" /></label>
        <label><span>Champ caméra POV <b id="fovLabel"></b></span><input id="fov" type="range" min="60" max="110" value="80" step="1" /></label>
        <label><span>Cône de vision (horizontal) <b id="coneLabel"></b></span><input id="cone" type="range" min="60" max="200" value="120" step="5" /></label>
        <label>Passes de la phase (clic : pause + POV du passeur)<div id="events" class="stack"></div></label>
        <pre id="analysis">Aucune passe sélectionnée.</pre>
        <pre id="stats"></pre>
        <pre id="summary"></pre>
      </aside>
      <main id="stage">
        <div id="view"></div>
        <canvas id="minimap" width="300" height="194"></canvas>
        <div id="reticle"></div>
        <div id="banner"></div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
